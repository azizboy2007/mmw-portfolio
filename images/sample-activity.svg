<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc"><title id="title">Square numbers</title><desc id="desc">One, four, nine and sixteen dots arranged in square grids. The nth term is n squared.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b88aff" stroke-opacity=".07"/></pattern></defs><rect width="1000" height="880" fill="#110c1d"/><rect width="1000" height="880" fill="url(#grid)"/><text x="66" y="87" fill="#8be7ed" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">PATTERNS &amp; SEQUENCES</text><text x="66" y="159" fill="#f7f4fc" font-family="Arial,sans-serif" font-weight="700" font-size="53">Small dots. Clear patterns.</text><rect x="92" y="200" width="360" height="225" rx="18" fill="#1b1329" stroke="#b88aff" stroke-opacity=".18"/><circle cx="272.0" cy="295.0" r="7" fill="#b88aff"/><text x="272" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#e7def4">1 × 1 = 1</text><rect x="548" y="200" width="360" height="225" rx="18" fill="#1b1329" stroke="#b88aff" stroke-opacity=".18"/><circle cx="713.5" cy="280.5" r="7" fill="#8be7ed"/><circle cx="742.5" cy="280.5" r="7" fill="#8be7ed"/><circle cx="713.5" cy="309.5" r="7" fill="#8be7ed"/><circle cx="742.5" cy="309.5" r="7" fill="#8be7ed"/><text x="728" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#e7def4">2 × 2 = 4</text><rect x="92" y="450" width="360" height="225" rx="18" fill="#1b1329" stroke="#b88aff" stroke-opacity=".18"/><circle cx="243.0" cy="516.0" r="7" fill="#b88aff"/><circle cx="272.0" cy="516.0" r="7" fill="#b88aff"/><circle cx="301.0" cy="516.0" r="7" fill="#b88aff"/><circle cx="243.0" cy="545.0" r="7" fill="#b88aff"/><circle cx="272.0" cy="545.0" r="7" fill="#b88aff"/><circle cx="301.0" cy="545.0" r="7" fill="#b88aff"/><circle cx="243.0" cy="574.0" r="7" fill="#b88aff"/><circle cx="272.0" cy="574.0" r="7" fill="#b88aff"/><circle cx="301.0" cy="574.0" r="7" fill="#b88aff"/><text x="272" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#e7def4">3 × 3 = 9</text><rect x="548" y="450" width="360" height="225" rx="18" fill="#1b1329" stroke="#b88aff" stroke-opacity=".18"/><circle cx="684.5" cy="501.5" r="7" fill="#8be7ed"/><circle cx="713.5" cy="501.5" r="7" fill="#8be7ed"/><circle cx="742.5" cy="501.5" r="7" fill="#8be7ed"/><circle cx="771.5" cy="501.5" r="7" fill="#8be7ed"/><circle cx="684.5" cy="530.5" r="7" fill="#8be7ed"/><circle cx="713.5" cy="530.5" r="7" fill="#8be7ed"/><circle cx="742.5" cy="530.5" r="7" fill="#8be7ed"/><circle cx="771.5" cy="530.5" r="7" fill="#8be7ed"/><circle cx="684.5" cy="559.5" r="7" fill="#8be7ed"/><circle cx="713.5" cy="559.5" r="7" fill="#8be7ed"/><circle cx="742.5" cy="559.5" r="7" fill="#8be7ed"/><circle cx="771.5" cy="559.5" r="7" fill="#8be7ed"/><circle cx="684.5" cy="588.5" r="7" fill="#8be7ed"/><circle cx="713.5" cy="588.5" r="7" fill="#8be7ed"/><circle cx="742.5" cy="588.5" r="7" fill="#8be7ed"/><circle cx="771.5" cy="588.5" r="7" fill="#8be7ed"/><text x="728" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#e7def4">4 × 4 = 16</text><path d="M66 730H934" stroke="#b88aff" stroke-opacity=".2"/><text x="66" y="795" font-family="Arial,sans-serif" font-size="31" fill="#b88aff">1, 4, 9, 16, …</text><text x="934" y="795" text-anchor="end" font-family="Georgia,serif" font-size="36" fill="#8be7ed">aₙ = n²</text><text x="66" y="843" font-family="Arial,sans-serif" font-size="17" letter-spacing="2" fill="#aaa3b8">SAMPLE ACTIVITY · MMW</text></svg>
